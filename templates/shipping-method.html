{% extends "base.html" %}
{% block title %}Forma de Envio{% endblock %}
{% block content %}
<section id="shipping" class="my-5">
    <div class="container my-5 py-5">
        <div class="section-header d-md-flex justify-content-between align-items-center">
            <h2 class="display-3 fw-normal">Forma de Envio</h2>
        </div>

        <form action="{{ url_for('produtos_routes.shipping_method') }}" method="POST">
            {% for id in ids_gerados %}
            <input type="hidden" name="id_tabela[]" value="{{ id }}">
            {% endfor %}    
            <div class="row">
                <div class="col-md-6">
                    <label for="cep" class="form-label">Digite seu CEP:</label>
                    <div class="input-group">
                        <input type="text" id="cep" name="cep" class="form-control" placeholder="00000-000" required>
                        <button class="btn btn-outline-secondary" type="button" id="cep-btn">
                            <iconify-icon icon="ic:outline-search"></iconify-icon>
                        </button>
                    </div>
                </div>            
                <div class="col-md-6">
                    <label for="shipping-info" class="form-label">Endereço:</label>
                    <div id="shipping-info" class="form-control" style="background-color: #f8f9fa; min-height: 6.3vh; max-height: 6.3vh; font-size: 12px; margin: auto">
                        <!-- Informações do endereço serão exibidas aqui -->
                    </div>
                </div>            
            </div>
            <br><br>
            <div class="row">
                <div class="col-md-6">
                    <label for="Número" id="numero-label" class="form-label" style="display: none;">Número</label>
                    <input type="text" id="numero" name="numero" class="form-control" placeholder="*" required style="display: none;">
                </div>
                <div class="col-md-6">
                    <label for="Complemento" id="complemento-label" class="form-label" style="display: none;">Complemento:</label>
                    <input type="text" id="complemento" name="complemento" class="form-control" placeholder="*" required style="display: none;">
                </div>
            </div>            
            
            <br><br>
            
            <div class="row">
                <div style="max-width: 50vh; margin: auto;">
                    <label for="cep" id="shipping-options-label" class="form-label" style="display: none;">Informe a forma de envio:</label>
                    <select id="shipping-options" class="form-control" name="forma_envio" disabled required style="display: none;">
                        <option>Selecione a forma de envio</option>
                        <option value="100.00">Selecionar envio R$100,00</option>
                        <option value="0.00">Combinar retirada (Tubarão/SC - Centro)</option>
                    </select>
                </div>
            </div>        
            
            <div class="row mt-4">
                <div class="col-12">
                    <input type="hidden" id="shipping-value-input" name="shipping_value" value="0.00">
                    <input type="hidden" id="final-total-input" name="final_total" value="0.00">
                    
                    <table class="table table-hover shadow rounded bg-light">
                        <thead>
                            <tr>
                                <th scope="col">Descrição</th>
                                <th scope="col">Valor</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Total do Carrinho</td>
                                <td id="cart-total">R$ 0,00</td>
                            </tr>
                            <tr>
                                <td>Frete</td>
                                <td id="shipping-value">R$ 0,00</td>
                            </tr>
                            <tr>
                                <td><strong>Valor Final</strong></td>
                                <td id="final-total"><strong>R$ 0,00</strong></td>
                            </tr>
                        </tbody>
                    </table>                    
                </div>
            </div>
        
            <div class="text-end">
                <button id="btn-prosseguir" class="btn btn-primary px-4 pt-3 pb-3" type="submit" disabled>Prosseguir</button>
                <a href="/cart" class="btn btn-outline-dark px-4 pt-3 pb-3">Voltar</a>
            </div>
        </form>
    </div>
</section>
<script src="../static/js/cart/shipping-method.js"></script>
{% endblock %}
