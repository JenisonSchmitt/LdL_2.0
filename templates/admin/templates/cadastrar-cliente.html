{% extends "admin/templates/baseAdmin_2.html" %}

{% block content %}
    <div class="container-fluid">
        <main class="tm-main">
            <h2 class="tm-pt-30 tm-color-primary tm-post-title">Cadastrar Cliente</h2>
            <form action="/submit-create-user-admin" method="POST" class="row g-3 justify-content-center" onsubmit="return validarFormulario()">
                <div class="">
                    <div class="form-section">
                        <h4 class="mb-3 color-pink">Informações Pessoais</h4>
                        <div class="row">
                            <div class="col-md-4 mx-auto">
                                <label for="cpf" class="form-label color-purple">CPF</label>
                                <input type="text" class="form-control" id="cpf" name="CPF" required>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-4 mx-auto">
                                <label for="nome" class="form-label color-purple">Nome</label>
                                <input type="text" class="form-control" id="nome" name="nome" required>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-4 mx-auto">
                                <label for="telefone" class="form-label color-purple">Telefone</label>
                                <input type="text" class="form-control" id="telefone" name="telefone" required>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-4 mx-auto">
                                <label for="email" class="form-label color-purple">E-mail</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-4 mx-auto">
                                <label for="nascimento" class="form-label color-purple">Data de Nascimento</label>
                                <input type="date" class="form-control" id="nascimento" name="nascimento" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-section mt-4">
                        <h4 class="mb-3 color-pink">Endereço</h4>
                        <div class="row">
                            <div class="col-md-4 mx-auto">
                                <label for="cep" class="form-label color-purple">CEP</label>
                                <input type="text" class="form-control" id="cep" name="cep" required>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-4 mx-auto">
                                <label for="rua" class="form-label color-purple">Rua</label>
                                <input type="text" class="form-control" id="rua" name="rua" required>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-4 mx-auto">
                                <label for="cidade" class="form-label color-purple">Cidade</label>
                                <input type="text" class="form-control" id="cidade" name="cidade" required>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-4 mx-auto">
                                <label for="numero" class="form-label color-purple">Número</label>
                                <input type="number" class="form-control" id="numero" name="numero" required>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-4 mx-auto">
                                <label for="complemento" class="form-label color-purple">Complemento</label>
                                <input type="text" class="form-control" id="complemento" name="complemento">
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-4 mx-auto">
                                <label for="estado" class="form-label color-purple">Estado</label>
                                <input type="text" class="form-control" id="estado" name="estado" required maxlength="2">
                            </div>
                        </div>
                    </div>

                    <div class="col-12 text-center mt-4">
                        <button type="submit" class="btn btn-primary px-4 pt-3 pb-3">Cadastrar</button>
                    </div>
                </div>
            </form>
        </main>
    </div>
    <script src="{{ url_for('static', filename='/staticAdmin/js/create_new_user.js') }}"></script>
    <script src="{{ url_for('static', filename='/staticAdmin/js/search_cep.js') }}"></script>
{% endblock %}
