{% extends "admin/templates/baseAdmin_2.html" %}

{% block content %}
    <div class="container-fluid">
        <main class="tm-main">    
            <div class="row tm-row">
                <h2 class="tm-pt-30 tm-color-primary tm-post-title">Cadastrar Produto</h2>
                
                <form action="/admin/cadastrar-produto" method="POST" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="nome">Nome do Produto</label>
                        <input type="text" class="form-control" id="nome" name="nome" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="descricao">Descrição</label>
                        <textarea class="form-control" id="descricao" name="descricao" rows="3" required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="preco">Preço</label>
                        <input type="number" class="form-control" id="preco" name="preco" step="0.01" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="quantidade">Quantidade em Estoque</label>
                        <input type="number" class="form-control" id="quantidade" name="quantidade" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="imagem">Imagem do Produto</label>
                        <input type="file" class="form-control-file" id="imagem" name="imagem" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Cadastrar</button>
                </form>
            </div>
        </main>
    </div>
{% endblock %}
