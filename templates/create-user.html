{% extends "base.html" %}
{% block title %}Cadastro de Usuários{% endblock %}
{% block content %}
<link rel="stylesheet" type="text/css" href="../static/css/user/style.css">
<section id="cadastro" class="my-5">
    <div class="container my-5 py-5">

        <div class="section-header d-md-flex justify-content-between align-items-center">
            <h2 class="display-3 fw-normal">Cadastro de Usuários</h2>
        </div>

        <form action="/submit_create_user" method="POST" class="row g-3 justify-content-center" onsubmit="return validarFormulario()">
            <div class="p-4 rounded shadow bg-light" style="justify-items: center; min-width: 95%; max-width: 98%;">
                <div class="col-10 p-4 rounded shadow bg-light" style="min-width: 95%;">
                    <h4 class="mb-3 color-pink">Informações Pessoais</h4>
                    <div class="row">
                        <div class="col-md-4 mx-auto">
                            <label for="cpf" class="form-label color-purple color-purple">CPF</label>
                            <input type="text" class="form-control" id="cpf" name="CPF" required>
                        </div>
                        <div class="col-md-4 mx-auto">
                            <label for="nome" class="form-label color-purple color-purple">Nome</label>
                            <input type="text" class="form-control" id="nome" name="nome" required>
                        </div>
                        <div class="col-md-4 mx-auto">
                            <label for="telefone" class="form-label color-purple">Telefone</label>
                            <input type="text" class="form-control" id="telefone" name="telefone" required>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-4 mx-auto">
                            <label for="email" class="form-label color-purple">E-mail</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="col-md-4 mx-auto">
                            <label for="nascimento" class="form-label color-purple">Data de Nascimento</label>
                            <input type="date" class="form-control" id="nascimento" name="nascimento" required>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-4 mx-auto">
                            <label for="senha" class="form-label color-purple">Senha</label>
                            <input type="password" class="form-control" id="senha" name="senha" required>
                        </div>
                        <div class="col-md-4 mx-auto">
                            <label for="confirme-senha" class="form-label color-purple">Confirme sua Senha</label>
                            <input type="password" class="form-control" id="confirme-senha" name="confirme-senha" required>
                        </div>
                    </div>
                </div>

                <div class="col-10 p-4 rounded shadow bg-light mt-4" style="min-width: 95%;">
                    <h4 class="mb-3 color-pink">Endereço</h4>
                    <div class="row">
                        <div class="col-md-4 mx-auto">
                            <label for="rua" class="form-label color-purple">Rua</label>
                            <input type="text" class="form-control" id="rua" name="rua" required>
                        </div>
                        <div class="col-md-4 mx-auto">
                            <label for="numero" class="form-label color-purple">Número</label>
                            <input type="number" class="form-control" id="numero" name="numero" required>
                        </div>
                        <div class="col-md-4 mx-auto">
                            <label for="complemento" class="form-label color-purple">Complemento</label>
                            <input type="text" class="form-control" id="complemento" name="complemento">
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-4 mx-auto">
                            <label for="cep" class="form-label color-purple">CEP</label>
                            <input type="text" class="form-control" id="cep" name="cep" required>
                        </div>
                        <div class="col-md-4 mx-auto">
                            <label for="cidade" class="form-label color-purple">Cidade</label>
                            <input type="text" class="form-control" id="cidade" name="cidade" required>
                        </div>
                        <div class="col-md-4 mx-auto">
                            <label for="estado" class="form-label color-purple">Estado</label>
                            <input type="text" class="form-control" id="estado" name="estado" required>
                        </div>
                    </div>
                </div>

                <div class="col-12 text-center mt-4">
                    <button type="submit" class="btn btn-primary px-4 pt-3 pb-3">Cadastrar</button>
                </div><br><br>
                <a href="/account#login"><h6 class="color-purple">Já possuo Conta</h6></a><br>
            </div>
        </form>
    </div>
</section>
<script src="../static/js/user/create_new_user.js"></script>
{% endblock %}
